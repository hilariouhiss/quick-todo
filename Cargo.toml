[package]
name = "iced-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["tokio", "debug", "time-travel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "fast-rng", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "time",
] }
directories = "6"
tracing-subscriber = "0.3"

[dev-dependencies]
iced_test = "0.14"
